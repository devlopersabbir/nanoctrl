name: Deploy GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-wiki:
    name: Sync & Publish Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Wiki
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Authenticate via OAuth2 token
          WIKI_REPO="https://oauth2:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch master

          mkdir -p wiki_clone

          echo "[INFO] Attempting to clone existing GitHub Wiki..."
          if git clone "$WIKI_REPO" wiki_clone; then
            echo "[INFO] Successfully connected to GitHub Wiki repository."
          else
            echo "[WARN] Could not clone wiki repository directly."
            echo "[INFO] Initializing local repository..."
            cd wiki_clone
            git init
            git remote add origin "$WIKI_REPO"
            cd ..
          fi

          # Copy modular wiki documentation
          cp -R wiki/* wiki_clone/

          cd wiki_clone
          git add .

          if git diff --staged --quiet; then
            echo "[OK] No changes to deploy to wiki."
          else
            git commit -m "docs(wiki): sync wiki documentation [skip ci]"
            
            echo "[INFO] Pushing wiki updates to GitHub..."
            if git push origin master --force || git push origin main --force; then
              echo "[SUCCESS] Successfully published GitHub Wiki!"
            else
              echo "::error::Failed to push to GitHub Wiki repository."
              echo "========================================================================="
              echo "HOW TO FIX THIS IN 10 SECONDS:"
              echo "1. Initialize GitHub Wiki: Go to your repository on GitHub -> Click the 'Wiki' tab -> Click 'Create the first page' (or 'Save page')."
              echo "   (GitHub does not physically create the .wiki.git backend until the first page is saved in the web UI)."
              echo "2. Enable Actions Write Permissions: Go to Settings -> Actions -> General -> Workflow permissions -> Select 'Read and write permissions'."
              echo "========================================================================="
              exit 1
            fi
          fi
