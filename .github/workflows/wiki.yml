name: Deploy GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-wiki:
    name: Sync & Publish Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check WIKI_TOKEN / Token Availability
        id: check_token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::warning::secrets.WIKI_TOKEN is not set. Note: GitHub restricts the default GITHUB_TOKEN from writing to the Wiki repository (.wiki.git). If the push fails with 404, please add a Personal Access Token as 'WIKI_TOKEN' in repository Secrets."
          fi

      - name: Deploy to GitHub Wiki
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch master

          WIKI_REPO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          mkdir -p wiki_clone

          echo "[INFO] Connecting to GitHub Wiki..."
          if git clone "$WIKI_REPO" wiki_clone 2>/dev/null; then
            echo "[INFO] Successfully connected to existing GitHub Wiki."
          else
            echo "[WARN] Could not clone directly. Initializing local branch..."
            cd wiki_clone
            git init
            git remote add origin "$WIKI_REPO"
            cd ..
          fi

          # Sync all wiki pages
          cp -R wiki/* wiki_clone/

          cd wiki_clone
          git add .

          if git diff --staged --quiet; then
            echo "[OK] Wiki is already up to date. No changes to commit."
          else
            git commit -m "docs(wiki): sync wiki documentation [skip ci]"

            echo "[INFO] Pushing updates to GitHub Wiki..."
            if git push origin master --force 2>/dev/null || git push origin main --force 2>/dev/null || git push -u origin master --force; then
              echo "[SUCCESS] Successfully published GitHub Wiki!"
            else
              echo "::error::GitHub rejected push to .wiki.git with 404/Authentication error."
              echo "=========================================================================="
              echo "WHY THIS HAPPENS ON GITHUB:"
              echo "1. GitHub's default GITHUB_TOKEN is intentionally blocked by GitHub from accessing the Wiki repository (.wiki.git)."
              echo "2. Solution: Create a Personal Access Token (PAT) with 'repo' scope and add it to:"
              echo "   Repository Settings -> Secrets and variables -> Actions -> New repository secret -> Name: 'WIKI_TOKEN'."
              echo "3. Also ensure you have created at least one initial page in your Wiki tab on GitHub (click 'Create the first page' -> 'Save page')."
              echo "=========================================================================="
              exit 1
            fi
          fi
